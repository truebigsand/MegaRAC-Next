# 生产部署示例：docker compose up -d
#
# 说明：
#   · 只暴露 5177 一个端口（进程同时提供 SPA 与 API）
#   · BMC 凭据不在这里配——由浏览器登录时透传，只驻代理内存
#   · 历史趋势库挂到命名卷，容器重建不丢
services:
  megarac-next:
    build:
      context: .
      # 国内网络可用镜像加速（默认值面向公网）：
      #   NODE_IMAGE=docker.m.daocloud.io/library/node:24-alpine NPM_REGISTRY=https://registry.npmmirror.com docker compose up -d --build
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: megarac-next:latest
    container_name: megarac-next
    restart: unless-stopped
    # 网络模式：默认与宿主共享网络栈（Linux 首选）——客户端 IP 不再被 NAT，
    # 日志/审计里是真实地址，也少一层转发。端口由下面的 PORT 决定，不用再写 ports。
    # 若在 Docker Desktop（Win/macOS）上跑，或想让容器与宿主网络隔离，则改用 bridge：
    #   删掉本行，改为  ports: ["5177:5177"]
    network_mode: host
    environment:
      # BMC 地址（换成你自己的）
      BMC_BASE: "https://192.168.0.200"
      # 监听所有网卡（默认）。本产品定位是内网/VPN 工具，请自行保证 5177 不暴露到公网。
      # 若想只让本机访问（前面挂 TLS/鉴权反代），把这里改成 127.0.0.1 并打开 COOKIE_SECURE=1。
      HOST: "0.0.0.0"
      PORT: "5177"
      TZ: "Asia/Shanghai"
      # 放在 HTTPS 后面时打开，让会话 cookie 带 Secure
      # COOKIE_SECURE: "1"
      # 放在反向代理后面时打开，req.ip 才会取 X-Forwarded-For（真实客户端 IP）
      # TRUST_PROXY: "1"
    volumes:
      - megarac-data:/app/server/data

volumes:
  megarac-data:
